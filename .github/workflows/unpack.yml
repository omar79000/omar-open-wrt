name: Inspect and Modify SIMAX1800T Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file squashfs-tools binwalk xxd tar gzip zstd python3

      - name: Find and inspect original firmware
        id: inspect
        shell: bash
        run: |
          set -u
          mkdir -p inspection

          FIRMWARE="$(find . -maxdepth 2 -type f \
            -name '*SIMAX1800T*FINAL*.bin' -print -quit)"

          if [ -z "$FIRMWARE" ]; then
            FIRMWARE="$(find . -maxdepth 2 -type f \
              -name '*SIMAX1800T*.bin' -print -quit)"
          fi

          if [ -z "$FIRMWARE" ]; then
            echo "Firmware file not found."
            find . -maxdepth 2 -type f -print \
              > inspection/repository-files.txt
            echo "recognized=false" >> "$GITHUB_OUTPUT"
            echo "tar_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Firmware: $FIRMWARE"
          echo "firmware_path=$FIRMWARE" >> "$GITHUB_OUTPUT"

          file "$FIRMWARE" | tee inspection/file-type.txt
          stat "$FIRMWARE" | tee inspection/file-stat.txt
          sha256sum "$FIRMWARE" | tee inspection/sha256.txt
          xxd -l 256 "$FIRMWARE" > inspection/header-hex.txt
          strings -n 8 "$FIRMWARE" | head -n 500 \
            > inspection/strings.txt || true
          binwalk "$FIRMWARE" > inspection/binwalk.txt 2>&1 || true

          if tar -tf "$FIRMWARE" > inspection/tar-list.txt 2>&1; then
            echo "tar_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "tar_detected=false" >> "$GITHUB_OUTPUT"
          fi

          cat inspection/file-type.txt
          cat inspection/sha256.txt
          cat inspection/tar-list.txt 2>/dev/null || true
          cat inspection/binwalk.txt 2>/dev/null || true

      - name: Check firmware archive layout
        id: layout
        shell: bash
        run: |
          set -euo pipefail

          FIRMWARE="${{ steps.inspect.outputs.firmware_path }}"

          if [ -z "$FIRMWARE" ] || \
             [ "${{ steps.inspect.outputs.tar_detected }}" != "true" ]; then
            echo "Firmware is not a recognized TAR archive. Rebuild skipped."
            exit 0
          fi

          mkdir -p work/archive

          if ! tar --no-same-owner --no-same-permissions \
            -xf "$FIRMWARE" -C work/archive; then
            echo "Extraction failed. Rebuild skipped."
            exit 0
          fi

          find work/archive -type f -print \
            > inspection/extracted-files.txt

          ROOT_DIR="$(find work/archive -type f -name CONTROL \
            -printf '%h\n' | head -n 1)"

          if [ -z "$ROOT_DIR" ] || \
             [ ! -f "$ROOT_DIR/kernel" ] || \
             [ ! -f "$ROOT_DIR/root" ]; then
            echo "Expected CONTROL, kernel, and root files not found."
            echo "Rebuild skipped to avoid generating an incompatible image."
            exit 0
          fi

          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "supported=true" >> "$GITHUB_OUTPUT"

          echo "Recognized archive directory: $ROOT_DIR"
          ls -lah "$ROOT_DIR"

      - name: Extract and customize root filesystem
        if: steps.layout.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${{ steps.layout.outputs.root_dir }}"
          ROOT="work/rootfs"

          mkdir -p work
          sudo unsquashfs -d "$ROOT" "$ROOT_DIR/root"

          # Preserve root ownership and permissions while allowing
          # privileged editing of extracted files.
          BRAND='اليحيوي للتجارة ومستلزمات الشبكات'

          sudo mkdir -p "$ROOT/etc/uci-defaults"

          sudo tee "$ROOT/etc/uci-defaults/99-al-yahyawi" \
            > /dev/null <<'SCRIPT'
          #!/bin/sh

          BRAND='اليحيوي للتجارة ومستلزمات الشبكات'

          # System identity
          uci set system.@system[0].hostname='AL-YAHYAWI-OPENWRT'
          uci set system.@system[0].description="$BRAND"
          uci commit system

          # Identify existing radio sections.
          for section in $(uci -q show wireless | sed -n \
            's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do

            band="$(uci -q get "wireless.$section.band" 2>/dev/null || true)"
            path="$(uci -q get "wireless.$section.path" 2>/dev/null || true)"
            name="$(uci -q get "wireless.$section.name" 2>/dev/null || true)"

            case "$band $path $name $section" in
              *2g*|*2G*|*2.4*|*radio0*)
                uci set "wireless.$section.channel=11"
                uci set "wireless.$section.beacon_int=50"
                ;;
              *5g*|*5G*|*5.0*|*radio1*)
                uci set "wireless.$section.channel=36"
                uci set "wireless.$section.country=PA"
                uci set "wireless.$section.beacon_int=100"
                uci -q delete "wireless.$section.txpower" || true
                ;;
            esac
          done

          # Configure existing AP interfaces only.
          for section in $(uci -q show wireless | sed -n \
            's/^wireless\.\([^.=]*\)=wifi-iface$/\1/p'); do

            mode="$(uci -q get "wireless.$section.mode" 2>/dev/null || true)"
            [ "$mode" = "ap" ] || continue

            device="$(uci -q get "wireless.$section.device" 2>/dev/null || true)"
            [ -n "$device" ] || continue

            band="$(uci -q get "wireless.$device.band" 2>/dev/null || true)"
            path="$(uci -q get "wireless.$device.path" 2>/dev/null || true)"
            name="$(uci -q get "wireless.$device.name" 2>/dev/null || true)"
            radio="$band $path $name $device"

            case "$radio" in
              *2g*|*2G*|*2.4*|*radio0*)
                uci set "wireless.$section.ssid=AL-YAHYAWI2.4G"
                uci set "wireless.$section.disassoc_low_ack=0"
                uci set "wireless.$section.dtim_period=1"
                uci set "wireless.$device.disabled=0"
                uci set "wireless.$device.txpower=33"
                ;;
              *5g*|*5G*|*5.0*|*radio1*)
                uci set "wireless.$section.ssid=AL-YAHYAWI5G"
                uci set "wireless.$section.disassoc_low_ack=0"
                uci set "wireless.$section.dtim_period=2"
                uci set "wireless.$device.disabled=0"
                uci -q delete "wireless.$device.txpower" || true
                ;;
            esac
          done

          uci commit wireless

          # Branding for the SSH/login banner and system issue.
          printf '\n%s\n' "$BRAND" >> /etc/banner
          printf '\n%s\n' "$BRAND" >> /etc/issue

          # Use a dark theme only if the theme exists in this firmware.
          if [ -d /www/luci-static/dark ]; then
            uci set luci.main.mediaurlbase='/luci-static/dark'
            uci set luci.main.title="$BRAND"
            uci commit luci
          fi

          # Bridge/AP profile: disable local DHCP, DNS and firewall.
          for service in dnsmasq firewall odhcpd; do
            if [ -x "/etc/init.d/$service" ]; then
              /etc/init.d/"$service" disable || true
              /etc/init.d/"$service" stop || true
            fi
          done

          exit 0
          SCRIPT

          sudo chmod 0755 "$ROOT/etc/uci-defaults/99-al-yahyawi"

          # Replace the Quick Programming text if the expected file exists.
          JS="$ROOT/www/luci-static/resources/view/tecsmart-quicksetup/main.js"

          if [ -f "$JS" ]; then
            sudo python3 - "$JS" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")

          old = "يمكنك استخدام هذه الإضافة الخاصة بميكروتيك يمن لبرمجة الراوتر خلال ثواني فقط"
          new = "يمكنك استخدام هذه الإضافة الخاصة باليحيوي للتجارة ومستلزمات الشبكات لبرمجة الراوتر خلال ثواني فقط"

          if old in text:
              text = text.replace(old, new)
              print("Quick Programming text updated.")
          else:
              print("Original text not found; file left otherwise unchanged.")

          p.write_text(text, encoding="utf-8")
          PY
          else
            echo "Quick Programming JS file not found; skipped."
          fi

          # Rebuild the root filesystem. Keep the original kernel and CONTROL.
          # -all-root avoids inheriting the GitHub runner's ownership.
          sudo mksquashfs "$ROOT" "$ROOT_DIR/root.new" \
            -noappend -comp xz -all-root

          sudo mv "$ROOT_DIR/root.new" "$ROOT_DIR/root"

          sudo sha256sum "$ROOT_DIR/kernel" "$ROOT_DIR/root" \
            > inspection/rebuilt-component-hashes.txt

          echo "Root filesystem rebuilt."

      - name: Repack candidate firmware
        if: steps.layout.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          tar -cf output/SIMAX1800T-custom-candidate.bin \
            -C work/archive .

          file output/SIMAX1800T-custom-candidate.bin \
            | tee inspection/candidate-file-type.txt

          sha256sum output/SIMAX1800T-custom-candidate.bin \
            | tee inspection/candidate-sha256.txt

          tar -tf output/SIMAX1800T-custom-candidate.bin \
            > inspection/candidate-tar-list.txt

      - name: Prepare inspection report
        if: always()
        shell: bash
        run: |
          mkdir -p inspection

          {
            echo "# SIMAX1800T firmware inspection"
            echo
            echo "This candidate is NOT validated for flashing."
            echo
            echo "## Original file type"
            cat inspection/file-type.txt 2>/dev/null || true
            echo
            echo "## Original SHA-256"
            cat inspection/sha256.txt 2>/dev/null || true
            echo
            echo "## Original TAR listing"
            cat inspection/tar-list.txt 2>/dev/null || true
            echo
            echo "## Binwalk"
            cat inspection/binwalk.txt 2>/dev/null || true
            echo
            echo "## Extracted files"
            cat inspection/extracted-files.txt 2>/dev/null || true
            echo
            echo "## Rebuilt component hashes"
            cat inspection/rebuilt-component-hashes.txt 2>/dev/null || true
            echo
            echo "## Candidate type and hash"
            cat inspection/candidate-file-type.txt 2>/dev/null || true
            cat inspection/candidate-sha256.txt 2>/dev/null || true
          } > inspection/REPORT.md

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIMAX1800T-ORIGINAL-FORMAT-REPORT
          path: inspection/
          if-no-files-found: warn

      - name: Upload candidate firmware
        if: steps.layout.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SIMAX1800T-custom-candidate-NOT-VALIDATED
          path: output/SIMAX1800T-custom-candidate.bin
          if-no-files-found: error
