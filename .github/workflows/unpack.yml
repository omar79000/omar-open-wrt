name: Inspect and Modify SIMAX1800T Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            squashfs-tools \
            binwalk \
            xxd \
            tar \
            gzip \
            zstd

      - name: Find and inspect original firmware
        id: inspect
        shell: bash
        run: |
          set -u

          mkdir -p inspection

          FIRMWARE="$(find . -maxdepth 2 -type f \
            -name '*SIMAX1800T*FINAL*.bin' \
            -print -quit)"

          if [ -z "$FIRMWARE" ]; then
            FIRMWARE="$(find . -maxdepth 2 -type f \
              -name '*SIMAX1800T*.bin' \
              -print -quit)"
          fi

          if [ -z "$FIRMWARE" ]; then
            echo "لم يتم العثور على ملف Firmware."
            find . -maxdepth 2 -type f -print
            echo "recognized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Firmware: $FIRMWARE"
          echo "firmware_path=$FIRMWARE" >> "$GITHUB_OUTPUT"

          file "$FIRMWARE" | tee inspection/file-type.txt
          stat "$FIRMWARE" | tee inspection/file-stat.txt
          sha256sum "$FIRMWARE" | tee inspection/sha256.txt
          xxd -l 256 "$FIRMWARE" > inspection/header-hex.txt
          strings -n 8 "$FIRMWARE" | head -n 500 \
            > inspection/strings.txt || true

          binwalk "$FIRMWARE" > inspection/binwalk.txt 2>&1 || true

          if tar -tf "$FIRMWARE" > inspection/tar-list.txt 2>&1; then
            echo "tar_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "tar_detected=false" >> "$GITHUB_OUTPUT"
          fi

          cat inspection/file-type.txt
          cat inspection/sha256.txt
          cat inspection/tar-list.txt || true
          cat inspection/binwalk.txt

          echo "recognized=false" >> "$GITHUB_OUTPUT"

      - name: Check whether firmware archive layout is supported
        id: layout
        shell: bash
        run: |
          set -euo pipefail

          FIRMWARE="${{ steps.inspect.outputs.firmware_path }}"

          if [ -z "$FIRMWARE" ] || \
             [ "${{ steps.inspect.outputs.tar_detected }}" != "true" ]; then
            echo "Archive is not a readable TAR. Rebuild skipped."
            exit 0
          fi

          mkdir -p work/archive

          if ! tar -xf "$FIRMWARE" -C work/archive; then
            echo "Unable to extract as TAR. Rebuild skipped."
            exit 0
          fi

          ROOT_DIR="$(find work/archive -type f -name CONTROL \
            -printf '%h\n' | head -n 1)"

          if [ -z "$ROOT_DIR" ] || \
             [ ! -f "$ROOT_DIR/kernel" ] || \
             [ ! -f "$ROOT_DIR/root" ]; then
            echo "Expected CONTROL, kernel, and root files were not found."
            echo "Rebuild skipped to protect the original firmware format."
            find work/archive -maxdepth 4 -type f -print \
              > inspection/extracted-files.txt
            exit 0
          fi

          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "supported=true" >> "$GITHUB_OUTPUT"
          echo "Recognized sysupgrade archive: $ROOT_DIR"

      - name: Install root filesystem utilities
        if: steps.layout.outputs.supported == 'true'
        run: |
          sudo apt-get install -y squashfs-tools

      - name: Extract and customize root filesystem
        if: steps.layout.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${{ steps.layout.outputs.root_dir }}"
          mkdir -p work/rootfs

          unsquashfs -d work/rootfs "$ROOT_DIR/root"

          ROOT="work/rootfs"
          BRAND='اليحيوي للتجارة ومستلزمات الشبكات'

          mkdir -p "$ROOT/etc/uci-defaults"
          mkdir -p "$ROOT/etc"

          cat > "$ROOT/etc/uci-defaults/99-al-yahyawi" <<'SCRIPT'
          #!/bin/sh

          BRAND='اليحيوي للتجارة ومستلزمات الشبكات'

          uci set system.@system[0].hostname='AL-YAHYAWI-OPENWRT'
          uci set system.@system[0].description="$BRAND"
          uci commit system

          # Wi-Fi defaults: configure existing radios without assuming
          # their section names or creating duplicate wireless interfaces.
          for section in $(uci -q show wireless | sed -n \
            's/^wireless\.\([^.=]*\)=wifi-device$/\1/p'); do
            band="$(uci -q get wireless."$section".band)"
            path="$(uci -q get wireless."$section".path)"
            name="$(uci -q get wireless."$section".name)"

            case "$band $path $name $section" in
              *2g*|*2G*|*2.4*|*phy0*)
                uci set wireless."$section".channel='11'
                uci set wireless."$section".beacon_int='50'
                ;;
              *5g*|*5G*|*5.0*|*phy1*)
                uci set wireless."$section".channel='36'
                uci set wireless."$section".country='PA'
                uci set wireless."$section".beacon_int='100'
                ;;
            esac
          done

          for section in $(uci -q show wireless | sed -n \
            's/^wireless\.\([^.=]*\)=wifi-iface$/\1/p'); do
            mode="$(uci -q get wireless."$section".mode)"

            if [ "$mode" = "ap" ]; then
              device="$(uci -q get wireless."$section".device)"
              band="$(uci -q get wireless."$device".band)"
              path="$(uci -q get wireless."$device".path)"
              name="$(uci -q get wireless."$device".name)"
              radio="$device $band $path $name"

              case "$radio" in
                *2g*|*2G*|*2.4*|*phy0*)
                  uci set wireless."$section".ssid='AL-YAHYAWI2.4G'
                  uci set wireless."$section".disassoc_low_ack='0'
                  uci set wireless."$device".disabled='0'
                  ;;
                *5g*|*5G*|*5.0*|*phy1*)
                  uci set wireless."$section".ssid='AL-YAHYAWI5G'
                  uci set wireless."$section".disassoc_low_ack='0'
                  uci set wireless."$device".disabled='0'
                  ;;
              esac
            fi
          done

          uci commit wireless

          # This profile is intended for an upstream-managed bridge/AP.
          # It disables local DHCP/DNS and firewall services.
          for service in dnsmasq firewall odhcpd; do
            if [ -x "/etc/init.d/$service" ]; then
              /etc/init.d/"$service" disable || true
              /etc/init.d/"$service" stop || true
            fi
          done

          # Add the brand to the SSH login banner.
          printf '\n%s\n' "$BRAND" >> /etc/banner

          exit 0
          SCRIPT

          chmod 0755 "$ROOT/etc/uci-defaults/99-al-yahyawi"

          # Replace the Quick Programming description if the file exists.
          JS="$ROOT/www/luci-static/resources/view/tecsmart-quicksetup/main.js"

          if [ -f "$JS" ]; then
            python3 - "$JS" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          text = p.read_text(encoding="utf-8")
          old = "يمكنك استخدام هذه الإضافة الخاصة بميكروتيك يمن لبرمجة الراوتر خلال ثواني فقط"
          new = "يمكنك استخدام هذه الإضافة الخاصة باليحيوي للتجارة ومستلزمات الشبكات لبرمجة الراوتر خلال ثواني فقط"
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY
          fi

          # Rebuild only the root filesystem. Keep the original kernel and
          # CONTROL files untouched.
          mksquashfs "$ROOT" "$ROOT_DIR/root.new" \
            -noappend -comp xz

          mv "$ROOT_DIR/root.new" "$ROOT_DIR/root"

          echo "Root filesystem customized."
          sha256sum "$ROOT_DIR/kernel" "$ROOT_DIR/root" \
            > inspection/rebuilt-component-hashes.txt

      - name: Repack candidate firmware
        if: steps.layout.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="${{ steps.layout.outputs.root_dir }}"
          mkdir -p output

          # Preserve the archive's top-level directory structure.
          tar -cf output/SIMAX1800T-custom-candidate.bin \
            -C work/archive .

          file output/SIMAX1800T-custom-candidate.bin \
            | tee inspection/candidate-file-type.txt
          sha256sum output/SIMAX1800T-custom-candidate.bin \
            | tee inspection/candidate-sha256.txt

      - name: Prepare inspection report
        if: always()
        shell: bash
        run: |
          {
            echo "# SIMAX1800T firmware inspection"
            echo
            echo "This workflow does not guarantee that the output is flashable."
            echo "A rebuild is attempted only when a standard TAR layout is detected."
            echo
            echo "## File type"
            cat inspection/file-type.txt 2>/dev/null || true
            echo
            echo "## SHA-256"
            cat inspection/sha256.txt 2>/dev/null || true
            echo
            echo "## TAR listing"
            cat inspection/tar-list.txt 2>/dev/null || true
            echo
            echo "## Binwalk"
            cat inspection/binwalk.txt 2>/dev/null || true
            echo
            echo "## Extracted files"
            cat inspection/extracted-files.txt 2>/dev/null || true
            echo
            echo "## Candidate"
            cat inspection/candidate-file-type.txt 2>/dev/null || true
            cat inspection/candidate-sha256.txt 2>/dev/null || true
          } > inspection/REPORT.md

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIMAX1800T-ORIGINAL-FORMAT-REPORT
          path: inspection/
          if-no-files-found: warn

      - name: Upload candidate firmware
        if: steps.layout.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SIMAX1800T-custom-candidate-NOT-VALIDATED
          path: output/SIMAX1800T-custom-candidate.bin
          if-no-files-found: error
